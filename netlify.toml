[build]
  publish = "web"
  # Команда сборки не нужна: игра — готовые статические файлы в папке web/

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/game.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "no-cache"
